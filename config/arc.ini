; haraka-plugin-arc: ARC (RFC 8617) sealing. See README.md.

[main]
; Off: the plugin loads but never seals.
enabled=true

; The signing domain (d=) and selector (s=). The public key is the DNS TXT
; record <selector>._domainkey.<domain>, in DKIM format: a DKIM key works.
domain=
selector=
; Read the selector from this environment variable instead (wins when set).
;selector_env=

; The private key (PEM, RSA of at least 1024 bits, 2048 recommended, or Ed25519):
; a file, relative to Haraka's config directory or absolute...
;private_key=arc/private.pem
; ...or the name of an environment variable that holds the PEM or the base64
; of the PEM (wins when set; for containers).
;private_key_env=

; The authserv-id of the ARC-Authentication-Results header. Default: config/me.
;authserv_id=

; Which messages are sealed:
; - a plugin set transaction.notes.arc_seal = true: always;
; - transaction.notes.arc_seal = false: never;
; - otherwise relayed mail (connection.relaying), when seal_relayed is true.
; Ordinary inbound mail is never sealed.
seal_relayed=true

; Also add the Authentication-Results header that the seal records.
add_authentication_results=false
